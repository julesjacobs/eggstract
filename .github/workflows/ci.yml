name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
      - run: cargo check --locked --all-targets --all-features
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo run --locked --features cli -- extract examples/sharing.json > solution.json
      - run: cargo run --locked --features cli -- verify examples/sharing.json solution.json
      - run: cargo run --locked --example sharing
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[exact]'
      - run: python -m unittest discover -s python/tests -v
      - run: python -m eggstract.exact examples/sharing.json --root R
  benchmark-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y coinor-libcbc-dev
      - run: cargo test --locked --manifest-path benchmarks/egg/Cargo.toml
