[package]
name = "eggstract-egg-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
egg = { version = "=0.11.0", features = ["lp"] }
eggstract = { path = "../.." }
good_lp = { version = "1", features = ["coin_cbc"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

upstream-gym = { path = "upstream-gym" }
